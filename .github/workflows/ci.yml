name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (x64 Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build WinNetMeter (Release x64)
        shell: cmd
        working-directory: src
        run: build.bat

      - name: Run Native Test Suite
        shell: cmd
        working-directory: src/tests
        run: run_tests.bat

      - name: Verify PE Metadata and Dependencies
        shell: pwsh
        run: |
          ./src/tests/windows_integration_tests.ps1 -Check Metadata
          ./src/tests/windows_integration_tests.ps1 -Check StaticRuntime
          ./src/tests/windows_integration_tests.ps1 -Check Imports

      - name: Verify Executable
        shell: pwsh
        run: |
          if (-not (Test-Path src/out/WinNetMeter.exe)) {
            Write-Error "Build artifact src/out/WinNetMeter.exe was not produced."
            exit 1
          }
          $item = Get-Item src/out/WinNetMeter.exe
          Write-Host "Built successfully: $($item.FullName) ($($item.Length) bytes)"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WinNetMeter-windows-x64
          path: src/out/WinNetMeter.exe
          if-no-files-found: error

  integration:
    name: Behavioral Integration Checks (x64 Windows)
    runs-on: windows-latest
    needs: build
    # These drive a real window, taskbar and Explorer on the runner and gate the
    # build. The list is read from the harness, so a new check runs here as soon
    # as it is added to its ValidateSet.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build WinNetMeter (Release x64)
        shell: cmd
        working-directory: src
        run: build.bat

      - name: Run Behavioral Integration Checks
        shell: pwsh
        run: |
          $harness = Get-Content -Raw src/tests/windows_integration_tests.ps1
          $set = [regex]::Match($harness, "(?s)ValidateSet\((.*?)\)\]").Groups[1].Value
          $peChecks = @('Metadata', 'StaticRuntime', 'Imports')   # run by the build job
          $checks = @([regex]::Matches($set, "'([^']+)'") | ForEach-Object { $_.Groups[1].Value } |
                      Where-Object { $_ -notin $peChecks })
          if ($checks.Count -lt 12) { throw "Parsed only $($checks.Count) checks from the harness" }
          $failed = @()
          foreach ($check in $checks) {
            Write-Host "::group::$check"
            try {
              ./src/tests/windows_integration_tests.ps1 -Check $check
              Write-Host "PASS: $check"
            } catch {
              Write-Host "FAIL: $check - $($_.Exception.Message)"
              $failed += $check
            }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Error "Failed checks: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All $($checks.Count) behavioral checks passed."
