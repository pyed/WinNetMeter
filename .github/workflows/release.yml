name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            exe: WinNetMeter.exe          # the standalone name earlier releases used
          - arch: arm64
            runner: windows-11-arm
            exe: WinNetMeter-arm64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build WinNetMeter (Release ${{ matrix.arch }})
        shell: cmd
        working-directory: src
        run: build.bat ${{ matrix.arch }}

      - name: Run Native Test Suite
        shell: cmd
        working-directory: src/tests
        run: run_tests.bat

      - name: Verify PE Metadata and Dependencies
        shell: pwsh
        run: |
          ./src/tests/windows_integration_tests.ps1 -Check Metadata -Arch ${{ matrix.arch }}
          ./src/tests/windows_integration_tests.ps1 -Check StaticRuntime -Arch ${{ matrix.arch }}
          ./src/tests/windows_integration_tests.ps1 -Check Imports -Arch ${{ matrix.arch }}

      - name: Stage Release Package and Compute Checksums
        shell: pwsh
        run: |
          $match = Select-String src/version.h -Pattern '^#define WINNETMETER_VERSION_STRING "([^"]+)"\r?$'
          if (-not $match) { throw "Could not parse WINNETMETER_VERSION_STRING from src/version.h" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }

          # The packaged exe is stamped from src/version.h, so a tag that disagrees
          # would ship a mislabelled release. Fail loudly instead.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $tag -ne "v$version") {
            throw "Tag '$tag' does not match src/version.h ('$version'). Bump version.h to $($tag.TrimStart('v')) or retag."
          }

          $pkgName = "WinNetMeter-$tag-windows-${{ matrix.arch }}"
          $stagingDir = "staging/$pkgName"
          New-Item -ItemType Directory -Path $stagingDir, dist -Force | Out-Null
          Copy-Item "src/out/WinNetMeter.exe" -Destination "$stagingDir/" -Force
          Copy-Item "README.md" -Destination "$stagingDir/" -Force
          Copy-Item "LICENSE" -Destination "$stagingDir/" -Force

          # Distribution ZIP (the exe inside is always WinNetMeter.exe)
          $zipPath = "dist/$pkgName.zip"
          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipPath -Force
          $zipHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$zipHash *$pkgName.zip`r`n" | Out-File -FilePath "$zipPath.sha256" -Encoding ascii -NoNewline

          # Standalone exe, named per architecture
          $exe = "${{ matrix.exe }}"
          Copy-Item "src/out/WinNetMeter.exe" -Destination "dist/$exe" -Force
          $exeHash = (Get-FileHash -Path "dist/$exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash *$exe`r`n" | Out-File -FilePath "dist/$exe.sha256" -Encoding ascii -NoNewline

          Write-Host "Generated release artifacts in dist/:"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Release Artifacts to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WinNetMeter $GITHUB_REF_NAME" \
            --generate-notes
